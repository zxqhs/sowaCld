# Copy to config.ini and paste your Discord Application ID.
# https://discord.com/developers/applications
#
# The "Playing X" name Discord shows is the application NAME in the
# Developer Portal. Rename the app to sowaCld there — RPC cannot
# override it reliably.

client_id = 000000000000000000

# Idle interval. While a track is playing or you are searching, the
# daemon polls every 400 ms so skips show up in Discord immediately.
poll_ms = 2000
idle_scans_to_clear = 2

# 0 = Playing (как игра), 2 = Listening to
activity_type = 0
activity_name = sowaCld

# Fallback if the track has no artwork (uploaded Art Asset key)
large_image_key = soundcloud
small_image_play = play
small_image_pause = pause

# Button is the current track permalink
button_label = Open Track

# error | warn | info | debug
log_level = info
